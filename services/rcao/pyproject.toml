[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "rcao-control-plane"
version = "0.2.0"
description = "R-CAO Python control plane and Agent runtime boundary"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "httpx>=0.27,<1",
]
postgres = [
  "psycopg[binary]>=3.2,<4",
]
openai = [
  "openai>=1,<2",
  "openai-agents>=0.1",
  "openai-codex>=0.1",
]

[project.scripts]
rcao-migrate = "app.migrations:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "postgres: tests that require the disposable PostgreSQL/pgvector CI service",
]

[tool.setuptools.packages.find]
where = ["."]
