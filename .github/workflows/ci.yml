name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: python -m pip install -e 'services/rcao[dev]'
      - run: python -m pytest -q services/rcao/tests
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
