name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://rcao:rcao@localhost:5432/rcao
      RCAO_RUN_POSTGRES_INTEGRATION: "1"
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: rcao
          POSTGRES_USER: rcao
          POSTGRES_PASSWORD: rcao
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rcao -d rcao"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: python -m pip install -e 'services/rcao[dev,postgres]'
      - run: rcao-migrate --directory db/migrations
      - run: python -m pytest -q services/rcao/tests
      - run: git diff --check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
