services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rcao
      POSTGRES_USER: rcao
      POSTGRES_PASSWORD: rcao
    ports:
      - "5432:5432"
    volumes:
      - rcao-postgres:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rcao -d rcao"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rcao-postgres:
